services:
  api:
    ports: !reset []
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}

  web:
    ports: !reset []
    restart: unless-stopped

  ingress:
    build: ./deploy/ingress
    restart: unless-stopped
    depends_on:
      - web
      - authelia

  authelia:
    image: authelia/authelia:4.38
    restart: unless-stopped
    volumes:
      - ./deploy/authelia:/config:ro
      - authelia_data:/data
    environment:
      TZ: UTC
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET is required}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_RESET_PASSWORD_JWT_SECRET:?AUTHELIA_RESET_PASSWORD_JWT_SECRET is required}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?AUTHELIA_STORAGE_ENCRYPTION_KEY is required}

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}

volumes:
  authelia_data:
